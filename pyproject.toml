[project]
name = "surveymap"
version = "0.1.0"
description = "Turn Layer 2/3 network surveys into interactive maps and draw.io / Visio exports."
readme = "README.md"
authors = [
    { name = "SurveyMap" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "scapy>=2.6",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
surveymap = "surveymap.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
